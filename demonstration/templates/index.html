<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNSホラーゲーム</title>
    <style>
        /* 画面全体のスタイル */
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* カード型枠（.game-box） */
        .game-box {
            width: 380px;
            max-width: 100%;
            border: 1px solid #38444d;
            border-radius: 12px;
            padding: 20px;
            background-color: #15202b;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* SNSアカウントヘッダー */
        .sns-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #38444d;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e0245e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
        }

        .user-info .name {
            font-weight: bold;
            font-size: 15px;
        }

        .user-info .handle {
            color: #8899a6;
            font-size: 13px;
        }

        /* 投稿本文 */
        .post-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Game Over等で表示する画像スタイル */
        .game-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #38444d;
            display: block;
        }

        /* 選択肢ボタンのエリア */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 選択肢ボタン */
        .choice-btn {
            width: 100%;
            padding: 12px;
            background-color: #1da1f2;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .choice-btn:hover {
            background-color: #1a91da;
        }

        .choice-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="game-box">
        <!-- アカウント情報 -->
        <div class="sns-header">
            <div class="avatar">👁</div>
            <div class="user-info">
                <div class="name">怪異タイムライン</div>
                <div class="handle">@unknown_eyes</div>
            </div>
        </div>

        <!-- シナリオ文章を表示 -->
        <div class="post-text">{{ data.text }}</div>

        <!-- 画像データがある場合（Game Over時など）のみ画像を表示 -->
        {% if data.image %}
            <img src="{{ url_for('static', filename=data.image) }}" class="game-image" alt="Game Over">
        {% endif %}

        <!-- 選択肢ボタンを動的生成 -->
        <form method="POST" class="choices-container">
            {% for choice in data.choices %}
                <button type="submit" name="next_stage" value="{{ choice.next }}" class="choice-btn">
                    {{ choice.text }}
                </button>
            {% endfor %}
        </form>
    </div>

</body>
</html>
